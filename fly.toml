# fly.toml app configuration file generated for farsanime-proxy on 2026-11-13T19:28:09Z
#
# See https://docs.fly.io/reference/configuration for information about how to use this file.
#

app = 'farsanime-proxy'
primary_region = 'ams'
kill_timeout = '24h'

[build]

[env]
  PORT = '8080'
  NODE_ENV = 'production'
  ALLOWED_HOSTS = 'farsanime.ir,di.farsanime.ir'
  UPSTREAM_REFERER = 'https://farsanime.ir/'
  FETCH_TIMEOUT_MS = '15000'
  MAX_REDIRECTS = '4'

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = true
  auto_start_machines = true
  min_machines_running = 0
  processes = ['app']

  # استریم رسانه ممکن است بین دو chunk چند لحظه بی‌ترافیک شود؛
  # idle_timeout را بالاتر از پیش‌فرض می‌گذاریم تا اتصال قطع نشود.
  checks = [{ grace_period = '10s', interval = '30s', method = 'GET', path = '/healthz', timeout = '5s' }]
  http_options = { idle_timeout = 300 }

[[vm]]
  size = 'shared-cpu-1x'
  memory = '256mb'
