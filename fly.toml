# fly.toml — Farsanime media proxy (Node.js) on Fly.io
#
# این سرویس stateless است و به ولوم نیاز ندارد.
# کلید PROXY_KEY به‌صورت secret ذخیره می‌شود (نه در این فایل).

app = 'farsanime-proxy'
primary_region = 'fra'

[build]

[env]
  PORT = '8080'
  NODE_ENV = 'production'
  ALLOWED_HOSTS = 'farsanime.ir,di.farsanime.ir'
  UPSTREAM_REFERER = 'https://farsanime.ir/'
  FETCH_TIMEOUT_MS = '15000'
  MAX_REDIRECTS = '4'

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = 'stop'
  auto_start_machines = true
  min_machines_running = 0
  processes = ['app']

  # استریم رسانه ممکن است بین دو chunk چند لحظه بی‌ترافیک شود؛
  # idle_timeout را بالاتر از پیش‌فرض می‌گذاریم تا اتصال قطع نشود.
  [http_service.http_options]
    idle_timeout = 300

  [[http_service.checks]]
    grace_period = '10s'
    interval = '30s'
    method = 'GET'
    path = '/healthz'
    timeout = '5s'

[[vm]]
  size = 'shared-cpu-1x'
  memory = '256mb'
