# fly.toml app configuration file generated for farsanime on 2026-11-13T19:18:25Z
#
# See https://docs.fly.io/reference/configuration for information about how to use this file.
#

app = 'farsanime'
primary_region = 'ams'

[build]
[env]
  ALLOWED_HOSTS = 'farsanime.ir,di.farsanime.ir'
  FETCH_TIMEOUT_MS = '15000'
  MAX_REDIRECTS = '4'
  NODE_ENV = 'production'
  PORT = '8080'
  UPSTREAM_REFERER = 'https://farsanime.ir/'

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = 'stop'
  auto_start_machines = true
  min_machines_running = 0
  processes = ['app']

  [http_service.http_options]
    idle_timeout = 300

  [[http_service.checks]]
    interval = '30s'
    timeout = '5s'
    grace_period = '10s'
    method = 'GET'
    path = '/healthz'

[[vm]]
  size = 'shared-cpu-1x'
  memory = '256mb'
